apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${NAME}
  namespace: ${NS}
  labels:
    app.kubernetes.io/name: ${NAME}
spec:
  replicas: 1
  strategy:
    type: Recreate            # RWO volume + read-only switch restarts the pod
  selector:
    matchLabels:
      app.kubernetes.io/name: ${NAME}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${NAME}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: registry
        image: ${REGISTRY_IMAGE}
        args: ["/etc/registry/config.yml"]   # image entrypoint runs `registry serve <file>`
        ports:
        - name: https
          containerPort: 5000
          protocol: TCP
        readinessProbe:
          httpGet:
            scheme: HTTPS
            path: /v2/
            port: 5000
          periodSeconds: 5
        livenessProbe:
          httpGet:
            scheme: HTTPS
            path: /v2/
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: config
          mountPath: /etc/registry
          readOnly: true
        - name: tls
          mountPath: /certs
          readOnly: true
        - name: data
          mountPath: /var/lib/registry
      volumes:
      - name: config
        configMap:
          name: ${NAME}-config
      - name: tls
        secret:
          secretName: ${NAME}-tls
      - name: data
        persistentVolumeClaim:
          claimName: ${NAME}
