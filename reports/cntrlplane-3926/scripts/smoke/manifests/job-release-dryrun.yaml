# Read-only discovery for full-payload mirroring (CNTRLPLANE-3931): payload size, component repositories,
# and the mirror instructions `oc adm release mirror` would print. --dry-run: nothing is pushed.
apiVersion: batch/v1
kind: Job
metadata:
  name: release-dryrun
  namespace: ${NS}
  labels:
    app.kubernetes.io/name: ${NAME}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${NAME}-copier
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: dryrun
        image: ${CLI_IMAGE}
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          export HOME=/tmp
          cat /etc/pki/tls/certs/ca-bundle.crt /run/mirror-ca/ca.crt > /tmp/ca-bundle.pem
          export SSL_CERT_FILE=/tmp/ca-bundle.pem
          PS=/run/source-pull-secret/.dockerconfigjson
          REL="${RELEASE_IMAGE}"
          echo "=== size"
          oc adm release info -a "$PS" --size "$REL" | tail -n 15
          echo "=== component repositories (unique)"
          oc adm release info -a "$PS" --pullspecs "$REL" | awk '{print $2}' | grep '@sha256:' | sed 's/@.*//' | sort -u
          echo "=== mirror dry-run"
          oc adm release mirror -a "$PS" --from="$REL" \
            --to="${INTERNAL}/quay.io/openshift-release-dev/ocp-release" \
            --keep-manifest-list=true --dry-run --print-mirror-instructions=idms 2>&1 | tail -n 40
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: mirror-ca
          mountPath: /run/mirror-ca
          readOnly: true
        - name: source-pull-secret
          mountPath: /run/source-pull-secret
          readOnly: true
      volumes:
      - name: mirror-ca
        configMap:
          name: ${NAME}-ca
      - name: source-pull-secret
        secret:
          secretName: source-pull-secret
