apiVersion: v1
kind: ConfigMap
metadata:
  name: ${NAME}-config
  namespace: ${NS}
  labels:
    app.kubernetes.io/name: ${NAME}
data:
  config.yml: |
    version: 0.1
    log:
      fields:
        service: registry
    storage:
      filesystem:
        rootdirectory: /var/lib/registry
      delete:
        enabled: false
      maintenance:
        uploadpurging:
          enabled: false
        readonly:
          enabled: ${READONLY}
    http:
      addr: :5000
      tls:
        certificate: /certs/tls.crt
        key: /certs/tls.key
    health:
      storagedriver:
        enabled: true
        interval: 10s
        threshold: 3
